# Herdr 共享配置（Windows/macOS/Linux 单一来源，平台差异在模板内条件化）。
onboarding = false

# Everforest (dark, medium) 配色，对齐 Neovim 配置（neanias/everforest-nvim）；
# 窗格 Shell 按平台选择。
[theme]
# 基底主题；可见 token 全部由下方 [theme.custom] 覆盖。
name = "catppuccin"
auto_switch = false

# panel_bg/sidebar_bg = "reset" 保留终端背景透明，对齐 nvim 的
# transparent_background_level = 1。
[theme.custom]
panel_bg = "reset"
sidebar_bg = "reset"
surface_dim = "#232a2e"
surface0 = "#475258"
surface1 = "#3d484d"
active_row_bg = "#343f44"
selection_bg = "#543a48"
overlay0 = "#7a8478"
overlay1 = "#859289"
text = "#d3c6aa"
subtext0 = "#9da9a0"
accent = "#a7c080"
green = "#a7c080"
teal = "#83c092"
blue = "#7fbbb3"
yellow = "#dbbc7f"
peach = "#e69875"
red = "#e67e80"
mauve = "#d699b6"
[terminal]
{{- if eq .chezmoi.os "windows" }}
default_shell = "nu.exe"
{{- else if eq .chezmoi.os "darwin" }}
default_shell = "/bin/zsh"
{{- else }}
default_shell = "zsh"
{{- end }}
{{- if eq .chezmoi.os "windows" }}
new_cwd = {{ printf "%s/Documents" .chezmoi.homeDir | quote }}
{{- else }}
new_cwd = "follow"
{{- end }}

# Herdr has one prefix, not Zellij's separate pane/tab/move modes.
[keys]
prefix = "ctrl+t"
focus_pane_left = ["alt+n", "alt+left", "prefix+n", "prefix+left"]
focus_pane_down = ["alt+e", "alt+down", "prefix+down"]
focus_pane_up = ["alt+u", "alt+up", "prefix+up"]
focus_pane_right = ["alt+i", "alt+right", "prefix+i", "prefix+right"]
swap_pane_left = ["alt+shift+n", "prefix+shift+n"]
swap_pane_down = ["alt+shift+e", "prefix+shift+e"]
swap_pane_up = ["alt+shift+u", "prefix+shift+u"]
swap_pane_right = ["alt+shift+i", "prefix+shift+i"]
navigate_pane_left = "n"
navigate_pane_down = "alt+e"
navigate_pane_up = "alt+u"
navigate_pane_right = "i"
navigate_workspace_up = ["u", "up"]
navigate_workspace_down = ["e", "down"]
previous_workspace = "prefix+u"
next_workspace = "prefix+e"
workspace_picker = "prefix+ctrl+o"
# Goto 弹窗内部方向键为 herdr 内置（↑↓/j/k 行、←→ 工作区分组），无配置项可改成 u/e/n/i；
# 因此只保留前缀入口，直接键位 ctrl+f 归还窗格内程序（readline 前进一字符）。
goto = "prefix+g"

# Zellij's automatic NewPane becomes an explicit right split.
split_vertical = ["alt+o", "prefix+r"]
split_horizontal = "prefix+d"
zoom = ["alt+f", "prefix+f"]
close_pane = ["ctrl+q", "prefix+w"]
rename_pane = "prefix+c"

new_tab = "prefix+o"
previous_tab = ["ctrl+shift+tab", "prefix+,"]
next_tab = ["ctrl+tab", "prefix+."]
switch_tab = ["ctrl+1..9", "prefix+1..9"]
close_tab = "prefix+shift+w"

resize_mode = "prefix+ctrl+n"
resize_pane_left = "ctrl+alt+n"
resize_pane_down = "ctrl+alt+e"
resize_pane_up = "ctrl+alt+u"
resize_pane_right = "ctrl+alt+i"

# Move defaults that conflict with Colemak focus/swap or pane creation.
# Reading commands invoke nvim explicitly; server EDITOR can predate shell setup.
edit_scrollback = ""
new_workspace = "prefix+shift+o"
rename_workspace = "prefix+shift+c"
open_notification_target = "prefix+shift+a"

[[keys.command]]
key = "prefix+shift+v"
type = "popup"
{{- if eq .chezmoi.os "windows" }}
command = {{ printf "py -3 \"%s/AppData/Roaming/herdr/read-session.py\" --scrollback" .chezmoi.homeDir | quote }}
{{- else }}
command = {{ printf "python3 \"%s/.config/herdr/read-session.py\" --scrollback" .chezmoi.homeDir | quote }}
{{- end }}
description = "Neovim 阅读当前滚屏"
width = "95%"
height = "95%"

[[keys.command]]
key = "prefix+shift+p"
type = "popup"
{{- if eq .chezmoi.os "windows" }}
command = {{ printf "py -3 \"%s/AppData/Roaming/herdr/read-session.py\" --session" .chezmoi.homeDir | quote }}
{{- else }}
command = {{ printf "python3 \"%s/.config/herdr/read-session.py\" --session" .chezmoi.homeDir | quote }}
{{- end }}
description = "Neovim 阅读完整 agent 会话"
width = "95%"
height = "95%"

[[keys.command]]
key = "prefix+v"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim 侧边栏"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "打开 agent 正在编辑的文件"

{{- if stat (joinPath .chezmoi.homeDir ".config/herdr/plugins/config/herdr-theme-picker") }}
[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-theme-picker.open"
description = "主题选择器"
{{- end }}

[ui]
# 使用原生光标，让 Windows / WSL 中文输入法候选框跟随输入位置。
host_cursor = "native"
status_indicators = "symbols"
pane_borders = "always"
show_agent_labels_on_pane_borders = true
accent = "#a7c080"

# 底部标签行右侧状态区（对齐 lualine 右段）：zoom 提示、活动窗格 git 分支
# （非 git 目录自动隐藏）、主机名、prefix 帮助入口、服务器本地时间；
# git 组件脚本按平台选择（Windows 用 status-git.cmd，其余用内联 sh）。
tab_bar_position = "bottom"
tab_bar_right = [
  { type = "zoom" },
{{- if eq .chezmoi.os "windows" }}
  { type = "command", command = '"%APPDATA%\herdr\status-git.cmd"', interval_seconds = 5, timeout_seconds = 2 },
{{- else }}
  { type = "command", command = 'cd "$HERDR_ACTIVE_PANE_CWD" 2>/dev/null && git rev-parse --is-inside-work-tree >/dev/null 2>&1 && { b=$(git branch --show-current); [ -n "$b" ] || b=detached; git diff-index --quiet HEAD -- 2>/dev/null && echo " $b" || echo " $b*"; }', interval_seconds = 5, timeout_seconds = 2 },
{{- end }}
  { type = "hostname" },
  { type = "text", text = "󰌌 ^T ?" },
  { type = "datetime", format = " %H:%M" },
]
tab_bar_right_separator = " · "

hide_tab_bar_when_single_tab = false
# 新建标签前显示命名框。
prompt_new_tab_name = true
mouse_capture = true
copy_on_select = true
sidebar_width = 30

# 已安装 icon-agent-ui 时启用图标、动画与分组；未安装的机器保留原生侧栏。
# OMP 的 $task 继续显示扩展上报的任务名。
[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    { token = "state_icon" },
    { token = "workspace", bold = true },
    { token = "state_text", dim = true },
  ],
  [
    { token = "branch", fg = "#83c092" },
    { token = "git_status" },
  ],
]

[ui.sidebar.agents]
{{- if stat (joinPath .chezmoi.homeDir ".config/herdr/plugins/config/qintmb.herdr-icon-agent-ui/config.toml") }}
row_gap = 0
rows = [
  [{ token = "$hs_group", bold = true }, { token = "$hs_group_dim", dim = true }],
  [{ token = "$hs_terminals", dim = true }],
  [{ token = "$hs_tab" }, { token = "$hs_tab_dim", dim = true }],
  [
    { token = "$hs_logo", fg = "#7fbbb3" },
    { token = "$hs_logo_dim", dim = true },
    { token = "$hs_working", fg = "#a7c080" },
    { token = "$hs_blocked", fg = "#e67e80", bold = true },
    { token = "$hs_done", fg = "#a7c080", bold = true },
    { token = "$hs_idle", dim = true },
    { token = "$hs_unknown", dim = true },
  ],
  [{ token = "$hs_title" }, { token = "$hs_title_dim", dim = true }],
  [{ token = "$hs_gap" }],
]

[ui.sidebar.agents.rows_by_agent]
omp = [
  [{ token = "$hs_group", bold = true }, { token = "$hs_group_dim", dim = true }],
  [{ token = "$hs_terminals", dim = true }],
  [{ token = "$hs_tab" }, { token = "$hs_tab_dim", dim = true }],
  [
    { token = "$hs_logo", fg = "#7fbbb3" },
    { token = "$hs_logo_dim", dim = true },
    { token = "$hs_working", fg = "#a7c080" },
    { token = "$hs_blocked", fg = "#e67e80", bold = true },
    { token = "$hs_done", fg = "#a7c080", bold = true },
    { token = "$hs_idle", dim = true },
    { token = "$hs_unknown", dim = true },
  ],
  [{ token = "$task", fg = "#d699b6" }],
  [{ token = "$hs_gap" }],
]
{{- else }}
row_gap = 1
rows = [
  [
    { token = "state_icon" },
    { token = "workspace", fg = "#a7c080", bold = true },
    { token = "tab" },
    { token = "pane", dim = true },
  ],
  [
    { token = "agent", fg = "#7fbbb3" },
    { token = "state_text", dim = true },
  ],
  [{ token = "$task", fg = "#d699b6" }],
]
{{- end }}

[ui.sound]
enabled = true

[ui.toast]
delivery = "herdr"
