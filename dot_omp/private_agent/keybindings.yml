# Migrated from ~/.config/opencode/tui.json.
# OMP supports single chords, not OpenCode's <leader> sequences.
app.model.cycleForward: F2
app.model.cycleBackward: Shift+F2
app.editor.external: Ctrl+G
app.clipboard.pasteImage:
  - Ctrl+Shift+V
  - Ctrl+V
  - Alt+V

# Autocomplete menu navigation.
# Tab also toggles plan mode during normal input via tab-plan-toggle extension.
tui.input.tab: []
tui.select.down:
  - Down
  - Tab
tui.select.up:
  - Up
  - Shift+Tab
tui.select.confirm: Enter

# Enter must stay on tui.input.submit so the autocomplete popup can confirm
# with it (the popup confirms on tui.input.submit, NOT tui.select.confirm;
# terminals send CR, so the editor's literal "\n" fallback never fires).
# Normal Enter submits / steers, including Herdr agent prompt (text + Enter).
tui.input.submit: Enter

# Ctrl+Enter queues a follow-up after the current turn (afterYield).
# Shift+Enter / Ctrl+J stay as newline.
app.message.followUp: Ctrl+Enter

# 思考强度仅由 Ctrl+L 切换，Ctrl+T 留给终端前缀。
app.thinking.cycle: Ctrl+L
app.thinking.toggle: []
# Release the built-in live voice chord (default Ctrl+L) so it cannot race the
# cycle binding; live mode stays reachable via /live or a rebind such as Ctrl+Shift+L.
app.live.toggle: []
# Normal input: Tab toggles write <-> plan mode.
app.plan.toggle:
  - Tab
  - Alt+Shift+P

# Herdr prefix+Shift+V reads scrollback; prefix+Shift+P reads the full session in nvim.
# PageUp/PageDown in OMP move the draft cursor or selector, not the transcript.
tui.editor.pageUp: PageUp
tui.editor.pageDown: PageDown
tui.select.pageUp: PageUp
tui.select.pageDown: PageDown
# Readline editing stays available in Insert; nvim owns output search and scrolling.
tui.editor.deleteToLineStart: Ctrl+U
tui.editor.cursorLineEnd:
  - End
  - Ctrl+E
