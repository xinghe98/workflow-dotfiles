# Alacritty 0.17 configuration
# Matched to C:\Users\mysta\.config\wezterm as closely as Alacritty supports.

[general]
live_config_reload = true
working_directory = "C:\\Users\\mysta"

[env]
TERM = "xterm-256color"
COLORTERM = "truecolor"

[terminal]
osc52 = "OnlyCopy"

[terminal.shell]
program = "C:\\Users\\mysta\\AppData\\Local\\Programs\\nu\\bin\\nu.exe"
args = []

[window]
padding = { x = 8, y = 10 }
dynamic_padding = false
decorations = "Full"
decorations_theme_variant = "Dark"
opacity = 0.90
startup_mode = "Maximized"
dynamic_title = true

# Alacritty has no Windows Acrylic backend. The 0.80 opacity above is the
# closest native equivalent; window.blur only works on macOS/KDE Wayland.

[scrolling]
history = 5000
multiplier = 3

[font]
size = 18.0
normal = { family = "Consolas Nerd Font", style = "Regular" }
bold = { family = "Consolas Nerd Font", style = "Bold" }
italic = { family = "Consolas Nerd Font", style = "Italic" }
bold_italic = { family = "Consolas Nerd Font", style = "Bold Italic" }
offset = { x = 0, y = 0 }
glyph_offset = { x = 0, y = 0 }
builtin_box_drawing = true

# Catppuccin Mocha (same scheme selected by WezTerm).
[colors.primary]
background = "#1E1E2E"
foreground = "#CDD6F4"
dim_foreground = "#CDD6F4"
bright_foreground = "#CDD6F4"

[colors.cursor]
text = "#1E1E2E"
cursor = "#F5E0DC"

[colors.vi_mode_cursor]
text = "#1E1E2E"
cursor = "#B4BEFE"

[colors.search.matches]
foreground = "#1E1E2E"
background = "#A6ADC8"

[colors.search.focused_match]
foreground = "#1E1E2E"
background = "#A6E3A1"

[colors.footer_bar]
foreground = "#1E1E2E"
background = "#A6ADC8"

[colors.hints.start]
foreground = "#1E1E2E"
background = "#F9E2AF"

[colors.hints.end]
foreground = "#1E1E2E"
background = "#A6ADC8"

[colors.selection]
text = "#1E1E2E"
background = "#F5E0DC"

[colors.normal]
black = "#45475A"
red = "#F38BA8"
green = "#A6E3A1"
yellow = "#F9E2AF"
blue = "#89B4FA"
magenta = "#F5C2E7"
cyan = "#94E2D5"
white = "#BAC2DE"

[colors.bright]
black = "#585B70"
red = "#F38BA8"
green = "#A6E3A1"
yellow = "#F9E2AF"
blue = "#89B4FA"
magenta = "#F5C2E7"
cyan = "#94E2D5"
white = "#A6ADC8"

[colors.dim]
black = "#45475A"
red = "#F38BA8"
green = "#A6E3A1"
yellow = "#F9E2AF"
blue = "#89B4FA"
magenta = "#F5C2E7"
cyan = "#94E2D5"
white = "#BAC2DE"

[cursor]
blink_interval = 700
blink_timeout = 0
unfocused_hollow = true

[cursor.style]
shape = "Block"
blinking = "Always"

[selection]
save_to_clipboard = false

[mouse]
hide_when_typing = true

[keyboard]
bindings = [
  # WezTerm-like copy mode, search, fullscreen, copy and paste.
  { key = "F1", action = "ToggleViMode" },
  { key = "F11", action = "ToggleFullscreen" },
  { key = "F", mods = "Control|Alt", action = "SearchForward" },
  { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "V", mods = "Control|Shift", action = "Paste" },

  # Alacritty has no tabs on Windows, so the new-tab shortcut opens a window.
  { key = "T", mods = "Control|Shift", action = "CreateNewWindow" },
  { key = "W", mods = "Control|Alt|Shift", action = "Quit" },

  # Preserve the existing Zellij tab-control sequences from WezTerm.
  { key = "Tab", mods = "Control", chars = "\u0014e\u0014" },
  { key = "Tab", mods = "Control|Shift", chars = "\u0014n\u0014" },

  # Match the WezTerm font-size shortcuts.
  { key = "ArrowUp", mods = "Control|Alt", action = "IncreaseFontSize" },
  { key = "ArrowDown", mods = "Control|Alt", action = "DecreaseFontSize" },
  { key = "R", mods = "Control|Alt", action = "ResetFontSize" },

  # Distinct Ctrl+Enter for OMP (queue vs interrupt). Kitty CSI-u: Enter+Ctrl.
  { key = "Return", mods = "Control", chars = "\u001b[13;5u" },
  { key = "NumpadEnter", mods = "Control", chars = "\u001b[13;5u" },
]
